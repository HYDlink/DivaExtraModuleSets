# DivaExtraModuleSets 配置文件 / Configuration
# 可直接在游戏内按 F8 打开设置面板修改 / Or press F8 in-game to edit

# 是否启用槽位拓展（false 时完全回退原生 3 通用 + 1 单曲，保留已有扩展存档不丢失）
enabled=true

# 通用设置槽位数量（1-26，对应 Shared Set A-Z；原生默认 3）
shared_slots=6

# 单曲设置槽位数量（1-10，对应 Song Specific 1-10；原生默认 1）
song_slots=2

# 屏幕右上角 HUD 槽位角标模式：always | extended_only | off
hud_mode=always
hud_offset_x=0
hud_offset_y=0
hud_scale=1.0

# 界面主题与语言：pearl | classic，auto | zh-CN | en | ja
ui_theme=pearl
language=auto

# 设置面板快捷键（支持 F1-F12 及 Ctrl+/Shift+/Alt+ 组合）
hotkey=F8

# HDR / Luma 色彩输出适配：auto | sdr | hdr10 | scrgb；白亮度 auto | 80..400
ui_color_output=auto
ui_white_nits=auto
